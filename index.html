<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090a0e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Black Pearl"><title>Black Pearl 2.0</title><style>
:root{color-scheme:dark;--gold:#d7af6b;--bg:#090a0e;--panel:#181a24;--muted:#a2a3af}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:15px -apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:600px;margin:auto;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 40px)}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;letter-spacing:3px;color:var(--gold);margin:0}small,.muted{color:var(--muted)}.cover{width:min(72vw,320px);height:min(72vw,320px);margin:28px auto 20px;border-radius:24px;background:radial-gradient(circle at 35% 25%,#4b4253,#191821 65%,#101016);display:grid;place-items:center;font-size:100px;color:var(--gold);box-shadow:0 15px 45px #0008}.center{text-align:center}#title{font-size:22px;font-weight:700;overflow-wrap:anywhere}#artist{color:var(--muted);margin:8px 0 24px}.times{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}input[type=range]{width:100%;accent-color:var(--gold)}.controls{display:flex;align-items:center;justify-content:center;gap:26px;margin:20px 0}button{border:0;background:none;color:white;font-size:20px;cursor:pointer}.play{background:var(--gold);color:#101010;border-radius:50%;width:72px;height:72px;font-size:30px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.action{background:#262833;padding:13px 10px;border-radius:12px;flex:1;font-size:13px;min-width:90px}section{background:var(--panel);padding:18px;border-radius:18px;margin:16px 0}h2{font-size:17px;margin:0 0 16px}.eq{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.band{padding:8px 4px;border:1px solid #363741;border-radius:10px;text-align:center}.band button{font-size:12px;color:var(--gold);padding:5px 0;width:100%}.band input{display:block;writing-mode:vertical-lr;direction:rtl;appearance:slider-vertical;height:105px;width:100%;margin:8px auto}.band span{font-size:11px;color:var(--muted)}.editor{margin-top:16px;padding:14px;background:#101117;border-radius:12px}.editor label{display:block;margin:12px 0 4px;color:var(--muted)}.editor output{color:var(--gold)}select{width:100%;background:#282a35;color:#fff;border:1px solid #444653;border-radius:8px;padding:10px}ul{list-style:none;margin:0;padding:0}li{padding:12px 4px;border-bottom:1px solid #333642;overflow-wrap:anywhere;display:flex;justify-content:space-between;gap:8px;align-items:center}li.active{color:var(--gold)}li button{font-size:14px;color:#ffaaa8}li .track{flex:1;text-align:left;font-size:14px}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}#status{font-size:12px;color:var(--muted);min-height:18px}
</style></head><body><main><header><h1>BLACK PEARL</h1><small>HI-FI 2.0</small></header><div class="cover">◆</div><div class="center"><div id="title">Музыка не выбрана</div><div id="artist">Добавьте файлы из памяти iPhone</div></div><input id="seek" type="range" min="0" max="100" value="0"><div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div><div class="controls"><button id="prev">⏮</button><button class="play" id="play">▶</button><button id="next">⏭</button></div><div class="actions"><button class="action" id="add">＋ Музыка</button><button class="action" id="shuffle">⇄ Перемешать</button><button class="action" id="repeat">↻ Повтор: все</button></div><input id="files" type="file" multiple accept="audio/*,.mp3,.m4a,.flac,.wav,.aac,.ogg" hidden><section><h2>Громкость</h2><input id="volume" type="range" min="0" max="100" value="85"></section><section><h2>Параметрический EQ · 20 полос</h2><div class="eq" id="eq"></div><div class="editor"><strong id="selected">Полоса 1</strong><label>Частота: <output id="freqValue"></output></label><input id="freq" type="range" min="20" max="20000" value="32"><label>Усиление: <output id="gainValue"></output></label><input id="gain" type="range" min="-12" max="12" step="0.5" value="0"><label>Q (ширина полосы): <output id="qValue"></output></label><input id="q" type="range" min="0.3" max="10" step="0.1" value="1"><label>Тип фильтра</label><select id="type"><option value="peaking">Peak</option><option value="lowshelf">Low shelf</option><option value="highshelf">High shelf</option></select></div><div class="actions"><button class="action" id="rock">ROCK / METAL</button><button class="action" id="flat">Сброс EQ</button></div></section><section><h2>Моя музыка</h2><p id="status"></p><ul id="playlist"></ul><button class="action" id="clear" style="margin-top:16px">Удалить всю музыку</button></section><footer>BLACK PEARL AUDIO • VERSION 2.0</footer></main><audio id="audio" preload="metadata"></audio><script>
'use strict';const $=id=>document.getElementById(id),audio=$('audio');const AC=window.AudioContext||window.webkitAudioContext;let context,filters,tracks=[],index=-1,shuffle=false,repeat=0,selected=0,db;const freqs=[32,45,63,90,125,180,250,350,500,700,1000,1400,2000,2800,4000,5600,8000,11000,14000,18000];const defaults=()=>freqs.map(f=>({f,g:0,q:1,type:'peaking'}));let settings=defaults();try{const saved=JSON.parse(localStorage.getItem('bp-eq-2'));if(Array.isArray(saved)&&saved.length===20)settings=saved}catch{}const save=()=>{try{localStorage.setItem('bp-eq-2',JSON.stringify(settings))}catch{}};function initAudio(){if(context)return;context=new AC();const source=context.createMediaElementSource(audio);filters=settings.map(s=>{const n=context.createBiquadFilter();n.type=s.type;n.frequency.value=s.f;n.Q.value=s.q;n.gain.value=s.g;return n});let node=source;filters.forEach(f=>{node.connect(f);node=f});node.connect(context.destination)}function updateFilter(i){if(filters){const n=filters[i],s=settings[i];n.type=s.type;n.frequency.value=s.f;n.Q.value=s.q;n.gain.value=s.g}save();renderBands()}function renderBands(){const parent=$('eq');parent.innerHTML='';settings.forEach((s,i)=>{const d=document.createElement('div');d.className='band';const b=document.createElement('button');b.textContent=s.f>=1000?(s.f/1000).toFixed(1)+'k':Math.round(s.f)+'Hz';b.onclick=()=>choose(i);const r=document.createElement('input');r.type='range';r.min=-12;r.max=12;r.step=.5;r.value=s.g;r.setAttribute('aria-label','Полоса '+(i+1));r.oninput=()=>{settings[i].g=Number(r.value);updateFilter(i);if(i===selected)showEditor()};const label=document.createElement('span');label.textContent=(s.g>0?'+':'')+s.g+' dB';d.append(b,r,label);parent.append(d)})}function choose(i){selected=i;showEditor()}function showEditor(){const s=settings[selected];$('selected').textContent='Полоса '+(selected+1);$('freq').value=s.f;$('gain').value=s.g;$('q').value=s.q;$('type').value=s.type;$('freqValue').textContent=Math.round(s.f)+' Hz';$('gainValue').textContent=s.g+' dB';$('qValue').textContent=s.q}['freq','gain','q','type'].forEach(id=>$(id).addEventListener('input',e=>{const key={freq:'f',gain:'g',q:'q',type:'type'}[id];settings[selected][key]=id==='type'?e.target.value:Number(e.target.value);updateFilter(selected);showEditor()}));$('rock').onclick=()=>{const g=[3,3,2.5,2,1.5,.5,0,-.5,-1,-.5,0,.5,1,1.5,2,2,1.5,1,0,0];settings=defaults().map((s,i)=>({...s,g:g[i]}));settings.forEach((_,i)=>updateFilter(i));showEditor()};$('flat').onclick=()=>{settings=defaults();settings.forEach((_,i)=>updateFilter(i));showEditor()};const fmt=t=>Number.isFinite(t)?Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'):'0:00';const storeName='black-pearl-tracks-v2';function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(storeName,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('songs'))r.result.createObjectStore('songs',{keyPath:'id',autoIncrement:true})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function transaction(mode,fn){return new Promise((resolve,reject)=>{const t=db.transaction('songs',mode),s=t.objectStore('songs');let result;const r=fn(s);if(r){r.onsuccess=()=>result=r.result;r.onerror=()=>reject(r.error)}t.oncomplete=()=>resolve(result);t.onerror=()=>reject(t.error)})}async function restore(){try{db=await openDB();const data=await transaction('readonly',s=>s.getAll());tracks=data.map(x=>({...x,url:URL.createObjectURL(x.blob)}));$('status').textContent=tracks.length?'Сохранено треков: '+tracks.length:'Добавьте музыку';render();if(tracks.length)load(0)}catch(e){$('status').textContent='Постоянное хранение недоступно: '+e.message}}$('add').onclick=()=>$('files').click();$('files').onchange=async e=>{const list=[...e.target.files];$('status').textContent='Сохраняем музыку…';for(const file of list){if(!file.type.startsWith('audio/')&&!/\.(mp3|m4a|flac|wav|aac|ogg)$/i.test(file.name))continue;let id;try{if(db)id=await transaction('readwrite',s=>s.add({name:file.name,blob:file}));else throw Error('Нет доступа к хранилищу')}catch(err){$('status').textContent='Память заполнена или недоступна. Трек доступен до закрытия приложения.'}tracks.push({id,name:file.name,blob:file,url:URL.createObjectURL(file)})}render();if(index<0&&tracks.length)load(0);if(db)$('status').textContent='Треков: '+tracks.length+' · сохраняются на устройстве';e.target.value=''};function render(){const p=$('playlist');p.innerHTML='';tracks.forEach((t,i)=>{const li=document.createElement('li');if(i===index)li.className='active';const b=document.createElement('button');b.className='track';b.textContent=(i+1)+'. '+t.name;b.onclick=()=>{load(i);play()};const del=document.createElement('button');del.textContent='✕';del.setAttribute('aria-label','Удалить трек');del.onclick=()=>remove(i);li.append(b,del);p.append(li)})}async function remove(i){const t=tracks[i];if(db&&t.id!=null)try{await transaction('readwrite',s=>s.delete(t.id))}catch{}URL.revokeObjectURL(t.url);tracks.splice(i,1);if(index===i){audio.pause();audio.removeAttribute('src');audio.load();index=-1;if(tracks.length)load(Math.min(i,tracks.length-1));else{$('title').textContent='Музыка не выбрана';$('artist').textContent='Добавьте файлы'}}else if(index>i)index--;render()}$('clear').onclick=async()=>{if(!confirm('Удалить все сохранённые треки?'))return;audio.pause();tracks.forEach(t=>URL.revokeObjectURL(t.url));tracks=[];index=-1;audio.removeAttribute('src');audio.load();if(db)try{await transaction('readwrite',s=>s.clear())}catch{}$('title').textContent='Музыка не выбрана';$('duration').textContent='0:00';$('current').textContent='0:00';$('status').textContent='Список пуст';render()};function load(i){if(!tracks.length)return;index=(i+tracks.length)%tracks.length;audio.src=tracks[index].url;$('title').textContent=tracks[index].name.replace(/\.[^.]+$/,'');$('artist').textContent='Локальная библиотека';$('seek').value=0;render();if('mediaSession'in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:$('title').textContent,artist:'Black Pearl'})}async function play(){if(index<0){$('files').click();return}try{initAudio();await context.resume();await audio.play()}catch(e){alert('Ошибка воспроизведения: '+e.message)}}$('play').onclick=()=>audio.paused?play():audio.pause();audio.onplay=()=>$('play').textContent='❚❚';audio.onpause=()=>$('play').textContent='▶';function next(step){if(!tracks.length)return;const n=shuffle?Math.floor(Math.random()*tracks.length):(index+step+tracks.length)%tracks.length;load(n);play()}$('next').onclick=()=>next(1);$('prev').onclick=()=>{if(audio.currentTime>3)audio.currentTime=0;else next(-1)};audio.onended=()=>{if(repeat===2){audio.currentTime=0;play()}else if(repeat===1&&index===tracks.length-1){audio.pause()}else next(1)};$('shuffle').onclick=()=>{shuffle=!shuffle;$('shuffle').style.color=shuffle?'var(--gold)':'white'};$('repeat').onclick=()=>{repeat=(repeat+1)%3;$('repeat').textContent=['↻ Повтор: все','↻ Повтор: выкл','↻ Повтор: один'][repeat]};audio.ontimeupdate=()=>{$('current').textContent=fmt(audio.currentTime);if(Number.isFinite(audio.duration)&&audio.duration>0)$('seek').value=audio.currentTime/audio.duration*100};audio.onloadedmetadata=()=>$('duration').textContent=fmt(audio.duration);$('seek').oninput=e=>{if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=audio.duration*Number(e.target.value)/100};$('volume').oninput=e=>{audio.volume=Number(e.target.value)/100;try{localStorage.setItem('bp-vol-2',e.target.value)}catch{}};const vol=Number(localStorage.getItem('bp-vol-2')??85);$('volume').value=vol;audio.volume=vol/100;if('mediaSession'in navigator){navigator.mediaSession.setActionHandler('play',play);navigator.mediaSession.setActionHandler('pause',()=>audio.pause());navigator.mediaSession.setActionHandler('nexttrack',()=>next(1));navigator.mediaSession.setActionHandler('previoustrack',()=>next(-1))}renderBands();showEditor();restore();
</script></body></html>
